name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: 安装依赖
        run: python -m pip install --upgrade pip && pip install pytest && pip install -e .

      - name: 规则表校验
        run: python -c "import json;json.load(open('prompt_lint/rules.json'));print('rules.json 合法')"

      - name: 运行测试（含 Python / JS 双端一致性）
        run: pytest tests/ -q

      - name: CLI 冒烟
        run: |
          # CLI 约定：退出码 0=得分≥75，1=得分<75，两者都是合法结果。
          # 冒烟只验证 JSON 结构有效，不依赖分数。
          set -x
          python -m prompt_lint.cli --json "帮我总结这份报告" > smoke_out.json || true
          python -c "import json; d = json.load(open('smoke_out.json', encoding='utf-8')); assert 0 <= d['score'] <= 100; assert isinstance(d['issues'], list); assert '# 任务' in d['rewrite']; print('CLI 正常，冒烟得分', d['score'])"
          python -m prompt_lint.cli --json "嗯帮我随便弄一下那个东西谢谢" > /dev/null || test $? -eq 1
          rm -f smoke_out.json

      - name: 生成前提问协议冒烟
        run: |
          set -x
          python -m prompt_lint.cli --clarify-only "帮我写个方案，写得专业一点" > smoke_clarify.txt || true
          python -c "t=open('smoke_clarify.txt',encoding='utf-8').read(); assert '先不要产出' in t and '默认' in t and '不要为了凑数而提问' in t; print('协议正常', len(t), '字符')"
          python -m prompt_lint.cli --clarify-only "帮我写个方案" --clarify off > smoke_off.txt || true
          python -c "assert open('smoke_off.txt',encoding='utf-8').read().strip()==''; print('off 档为空，符合预期')"
          rm -f smoke_clarify.txt smoke_off.txt

  deploy:
    needs: test
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: 同步规则表到静态站点
        run: |
          cp prompt_lint/rules.json web/rules.json
          mkdir -p _site && cp -r web/* _site/
          touch _site/.nojekyll

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4

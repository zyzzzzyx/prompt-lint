name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: 安装依赖
        run: python -m pip install --upgrade pip && pip install pytest && pip install -e .

      - name: 规则表校验
        run: python -c "import json;json.load(open('prompt_lint/rules.json'));print('rules.json 合法')"

      - name: 运行测试（含 Python / JS 双端一致性）
        run: pytest tests/ -q

      - name: CLI 冒烟
        run: |
          # CLI 约定：退出码 0=得分≥75，1=得分<75，两者都是合法结果。
          # 冒烟只验证 JSON 结构有效，不依赖分数。
          python -m prompt_lint.cli --json "帮我总结这份报告" > /tmp/smoke.json || true
          python - <<'EOF'
          import json
          d = json.load(open("/tmp/smoke.json", encoding="utf-8"))
          assert isinstance(d["score"], int) and 0 <= d["score"] <= 100, d["score"]
          assert isinstance(d["issues"], list)
          assert "# 任务" in d["rewrite"]
          print(f"CLI 正常，冒烟得分 {d['score']}")
          EOF
          echo "--- 退出码约定验证 ---"
          python -m prompt_lint.cli --json "嗯帮我随便弄一下那个东西谢谢" > /dev/null
          code=$?
          if [ "$code" -eq 0 ] || [ "$code" -eq 1 ]; then echo "退出码 $code 符合约定"; else echo "非法退出码 $code"; exit 1; fi

  deploy:
    needs: test
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: 同步规则表到静态站点
        run: |
          cp prompt_lint/rules.json web/rules.json
          mkdir -p _site && cp -r web/* _site/
          touch _site/.nojekyll

      - uses: actions/configure-pages@v5
        with:
          enablement: true  # 自动启用 Pages，免手动去 Settings 里开
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4

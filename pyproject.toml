[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "prompt-lint"
version = "1.1.0"
description = "站在模型视角，诊断提示词中的歧义、偏差与误解风险"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
classifiers = [
    "Programming Language :: Python :: 3",
    "Topic :: Text Processing :: Linguistic",
]

[project.scripts]
prompt-lint = "prompt_lint.cli:main"

[tool.setuptools]
packages = ["prompt_lint"]

[tool.setuptools.package-data]
prompt_lint = ["rules.json"]
